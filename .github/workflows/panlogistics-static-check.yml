name: PANLOGISTICS - Validacion estatica

on:
  push:
    branches:
      - main
      - refactor/**
  pull_request:
    branches:
      - main

jobs:
  javascript-and-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Revisar sintaxis de todos los modulos JavaScript
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find assets/js -type f -name '*.js' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No se encontraron archivos JavaScript."
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Comprobando: $file"
            node --check "$file"
          done
      - name: Comprobar que los scripts locales del HTML existen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script\\s+src="([^"]+)"', html, flags=re.I)
          missing = [src for src in scripts if not src.startswith(("http://", "https://")) and not Path(src).is_file()]
          if missing:
              print("Scripts locales faltantes:")
              print("\\n".join(missing))
              raise SystemExit(1)
          print(f"Correcto: {len(scripts)} etiquetas script revisadas; todos los archivos locales existen.")
          PY
